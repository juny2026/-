:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#182c3d;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#18354c;color:white;padding:14px 16px}header strong{font-size:18px}header small{display:block;color:#d5e2ec;margin-top:4px}main{max-width:1050px;margin:auto;padding:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}button,.filelabel{border:1px solid #b8c8d2;background:white;border-radius:8px;padding:10px 12px;font-size:15px;cursor:pointer;min-height:42px}button.primary{background:#155c84;color:white;border-color:#155c84}button:disabled{opacity:.5}input[type=file]{max-width:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.card{background:white;border:1px solid #d7e1e8;border-radius:10px;padding:12px;min-width:0}.map{height:560px;max-height:68vh;border:1px solid #cbd6df;background:white;overflow:hidden;touch-action:none;border-radius:8px}svg{width:100%;height:100%;display:block}svg text{cursor:pointer;user-select:none}svg .hit{fill:transparent;cursor:pointer}svg .chosen{fill:#b14e00;font-weight:bold}.status{font-size:13px;color:#526578}.pointrow{width:100%;text-align:left;border-bottom:1px solid #e2e8ed;border-radius:0;padding:9px 4px}.pointrow.active{background:#e6f4ff}.scroll{max-height:380px;overflow:auto}.badge{display:inline-block;border-radius:30px;padding:2px 8px;font-size:12px;background:#eef2f5}dialog{border:0;border-radius:12px;padding:20px;width:min(95vw,450px);box-shadow:0 10px 40px #0004}dialog::backdrop{background:#0008}dialog input[type=text]{font-size:19px;padding:10px;width:100%;border:1px solid #9ab0bf;border-radius:7px}dialog h2{margin:0 0 12px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.photo{min-width:0}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px}.photo button{padding:3px;min-height:30px;font-size:12px}.hint{font-size:13px;color:#516879;line-height:1.6}.pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#b6c1ca}.pill.one{background:#d9a02b}.pill.both{background:#2c9871}.notice{padding:10px;background:#eef6fc;border-radius:7px;margin-bottom:10px;font-size:13px} @media(max-width:700px){.layout{grid-template-columns:1fr}.map{height:440px;max-height:none}.scroll{max-height:200px}}
</style></head><body><header><strong>測量写真撮影アプリ｜DXF対応版（iPhone操作感度改良）</strong><small>TREND-ONE DXF読込対応・点名を直接タップして撮影</small></header><main><div class="notice">DXFファイルは端末内で読み込みます。点名はOCR不要で選択できます。撮影状況は<strong>点名の下線</strong>で示します（黄：片方のみ／緑：遠景・近景あり）。</div><div class="bar"><label class="filelabel">📂 DXFファイルを開く <input id="dxfFile" type="file" accept=".dxf" style="display:block;max-width:230px;font-size:12px;margin-top:5px"></label><span id="fileInfo" class="status">DXFファイルを選択してください</span></div><div class="bar"><button id="zoomIn">＋ 拡大</button><button id="zoomOut">－ 縮小</button><button id="reset">全体表示</button><label style="font-size:14px">移動感度 <select id="panSpeed"><option value="1">標準</option><option value="2" selected>高速</option><option value="3">超高速</option></select></label><label style="font-size:14px">拡大感度 <select id="pinchSpeed"><option value="1">標準</option><option value="1.8" selected>高速</option><option value="2.6">超高速</option></select></label><label><input id="layerText" type="checkbox" checked> 地番表示</label><label><input id="layerMark" type="checkbox" checked> 撮影状況表示</label><button id="export" class="primary">写真をZIP出力</button></div><div class="layout"><section class="card"><div id="map" class="map"><svg id="drawing" role="img" aria-label="DXF図面。点名をタップすると撮影画面を開きます"></svg></div><p class="hint">図面をタップして点名を選択。ドラッグで移動、マウスホイールまたは＋－で拡大縮小できます。スマートフォンでは2本指で拡大・縮小できます。</p></section><aside class="card"><b>点名一覧</b><p class="status" id="counts"></p><div class="bar"><input id="search" placeholder="点名を検索" aria-label="点名を検索" style="width:100%;padding:10px;font-size:16px;border:1px solid #b8c8d2;border-radius:7px"></div><div class="scroll" id="points"></div></aside></div><p id="message" class="hint" aria-live="polite"></p></main><dialog id="dlg"><h2>撮影点の確認</h2><p class="hint">DXFから取得した点名です。必要なら修正できます。</p><label for="pointName">点名</label><input id="pointName" type="text" autocomplete="off"><p class="status" id="photoCount"></p><div class="bar"><button id="far" class="primary">遠景を撮影</button><button id="near" class="primary">近景を撮影</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><div id="photos" class="photos"></div><div class="bar" style="margin-top:16px"><button id="close">図面に戻る</button></div></dialog><script>
let data={lines:[],texts:[],circles:[]};const $=id=>document.getElementById(id);const svg=$('drawing');const NS='http://www.w3.org/2000/svg';let textPoints=data.texts.filter(t=>t.layer==='SRV_CH1_SOKUTENME');const state=new Map();let selected=null,kind=null,db=null;let drawingId='builtin';let currentFileName='未選択';let view={x:-15,y:-15,w:365,h:290};let original={...view};const map=$('map');function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function vb(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function getState(t){if(!state.has(t.name))state.set(t.name,{far:[],near:[]});return state.get(t.name)}function marker(t){const s=getState(t);return s.far.length&&s.near.length?'both':s.far.length||s.near.length?'one':''}function draw(){svg.replaceChildren();vb();const g=el('g',{transform:'translate(0 260) scale(1 -1)'},svg);for(const a of data.lines)el('line',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],stroke:a[4]==='SRV_CH1_GAIKUSEN'?'#364f62':'#8ca2b2','stroke-width':'.32'},g);for(const a of data.circles)el('circle',{cx:a[0],cy:a[1],r:a[2],fill:'none',stroke:'#4b6a7c','stroke-width':'.24'},g);for(const t of data.texts){if(t.layer==='SRV_CH1_CHIBANME'&&!$('layerText').checked)continue;const isPoint=t.layer==='SRV_CH1_SOKUTENME';const group=el('g',{transform:`translate(${t.x} ${t.y}) rotate(${t.rotation})`},g);const text=el('text',{x:0,y:0,'font-size':t.h,'font-family':'sans-serif',fill:isPoint?'#0b3d65':'#667885',transform:'scale(1 -1)'},group);text.textContent=t.name;if(isPoint){const width=Math.max(t.h*1.1,t.name.length*t.h*.68);el('rect',{x:-t.h*.35,y:-t.h*.8,width:width+t.h*.7,height:t.h*1.7,class:'hit'},group).addEventListener('click',ev=>{ev.stopPropagation();openPoint(t)});text.addEventListener('click',ev=>{ev.stopPropagation();openPoint(t)});const m=marker(t);if(m&&$('layerMark').checked)el('line',{x1:0,y1:-t.h*.85,x2:width,y2:-t.h*.85,stroke:m==='both'?'#15845f':'#d9a02b','stroke-width':'.55'},group)}}}function renderList(){const term=$('search').value.trim().toLowerCase();const box=$('points');box.replaceChildren();let done=0;for(const t of textPoints){const s=getState(t);if(s.far.length&&s.near.length)done++;if(!t.name.toLowerCase().includes(term))continue;const b=document.createElement('button');b.className='pointrow'+(selected===t?' active':'');const m=marker(t);b.innerHTML=`<span class="pill ${m}"></span><b>${esc(t.name)}</b> <span class="status">遠${s.far.length} / 近${s.near.length}</span>`;b.onclick=()=>openPoint(t);box.appendChild(b)}$('counts').textContent=`点名 ${textPoints.length}件 ／ 遠景・近景あり ${done}件`}function openPoint(t){selected=t;$('pointName').value=t.name;$('dlg').showModal();renderPhotos();renderList()}function activeName(){return $('pointName').value.trim().replace(/[\\/:*?"<>|]/g,'_')}function renderPhotos(){if(!selected)return;const s=getState(selected);$('photoCount').textContent=`遠景 ${s.far.length}枚 ／ 近景 ${s.near.length}枚`;const box=$('photos');box.replaceChildren();for(const k of ['far','near'])s[k].forEach((p,i)=>{const cell=document.createElement('div');cell.className='photo';const img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.onload=()=>URL.revokeObjectURL(img.src);cell.appendChild(img);const label=document.createElement('div');label.className='status';label.textContent=`${k==='far'?'遠':'近'} ${i+1}`;cell.appendChild(label);const del=document.createElement('button');del.textContent='削除';del.onclick=async()=>{await dbDelete(p.id);s[k].splice(i,1);renderPhotos();draw();renderList()};cell.appendChild(del);box.appendChild(cell)})}function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('survey-photo-dxf-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function dbAll(){return new Promise((resolve,reject)=>{const r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function dbAdd(o){return new Promise((resolve,reject)=>{const r=db.transaction('photos','readwrite').objectStore('photos').add(o);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function dbDelete(id){return new Promise((resolve,reject)=>{const r=db.transaction('photos','readwrite').objectStore('photos').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function zoom(f,cx=view.x+view.w/2,cy=view.y+view.h/2){const w=view.w*f,h=view.h*f;if(w<3||w>2000)return;view={x:cx-(cx-view.x)*f,y:cy-(cy-view.y)*f,w,h};vb()}$('panSpeed').onchange=e=>panSensitivity=Number(e.target.value);$('pinchSpeed').onchange=e=>pinchSensitivity=Number(e.target.value);$('zoomIn').onclick=()=>zoom(.7);$('zoomOut').onclick=()=>zoom(1.4);$('reset').onclick=()=>{view={...original};vb()};$('layerText').onchange=draw;$('layerMark').onchange=draw;$('search').oninput=renderList;$('close').onclick=()=>$('dlg').close();$('far').onclick=()=>{kind='far';$('camera').click()};$('near').onclick=()=>{kind='near';$('camera').click()};$('camera').onchange=async e=>{const file=e.target.files[0];if(!file||!selected)return;const name=activeName();if(!name){alert('点名を入力してください');return}try{const item={drawingId,point:selected.name,name,kind,blob:file,date:Date.now()};item.id=await dbAdd(item);getState(selected)[kind].push(item);renderPhotos();draw();renderList()}catch(err){alert('保存できませんでした: '+err.message)}e.target.value=''};let pointers=new Map(),last=null;let panSensitivity=2.0,pinchSensitivity=1.8;map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;if(e.buttons && !map.hasPointerCapture(e.pointerId)){const start=pointers.get(e.pointerId);if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>6){try{map.setPointerCapture(e.pointerId)}catch(_){}}}const old=[...pointers.values()];pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=[...pointers.values()];const r=map.getBoundingClientRect();if(now.length===1&&old.length===1){view.x-=panSensitivity*(now[0].x-old[0].x)/r.width*view.w;view.y-=panSensitivity*(now[0].y-old[0].y)/r.height*view.h;vb()}else if(now.length===2&&old.length===2){const dist=a=>Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);const d0=dist(old),d1=dist(now);if(d0>0&&d1>0){const x=view.x+((now[0].x+now[1].x)/2-r.left)/r.width*view.w,y=view.y+((now[0].y+now[1].y)/2-r.top)/r.height*view.h;zoom(Math.pow(d0/d1,pinchSensitivity),x,y)}}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])map.addEventListener(ev,e=>pointers.delete(e.pointerId));map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoom(e.deltaY>0?1.2:.83,view.x+(e.clientX-r.left)/r.width*view.w,view.y+(e.clientY-r.top)/r.height*view.h)},{passive:false});

// DXF reader: common ASCII DXF entities from TREND-ONE. No external network dependency.
function parseDXF(text){
 const lines=text.replace(/\r/g,'').split('\n'),pairs=[];
 for(let i=0;i+1<lines.length;i+=2){const c=Number(lines[i].trim());if(Number.isFinite(c))pairs.push([c,lines[i+1].trim()]);}
 const objects=[];let inEntities=false,section='';
 for(let i=0;i<pairs.length;i++){
  const [code,value]=pairs[i];
  if(code===0&&value==='SECTION'){section=pairs[i+1]?.[1]==='ENTITIES'?'ENTITIES':'OTHER';inEntities=section==='ENTITIES';continue}
  if(code===0&&value==='ENDSEC'){inEntities=false;continue}
  if(!inEntities||code!==0)continue;
  const type=value,fields=[];while(i+1<pairs.length&&pairs[i+1][0]!==0)fields.push(pairs[++i]);
  objects.push({type,fields});
 }
 const get=(f,c,d='')=>f.find(x=>x[0]===c)?.[1]??d;
 const num=(f,c,d=0)=>{const v=Number(get(f,c,d));return Number.isFinite(v)?v:d};
 const raw={lines:[],circles:[],texts:[]};let skipped=new Map();
 const addline=(x1,y1,x2,y2,l)=>{if([x1,y1,x2,y2].every(Number.isFinite))raw.lines.push([x1,y1,x2,y2,l])};
 let poly=null;
 for(const o of objects){const f=o.fields,t=o.type,layer=get(f,8,'0');
  if(t==='LINE')addline(num(f,10),num(f,20),num(f,11),num(f,21),layer);
  else if(t==='CIRCLE'){raw.circles.push([num(f,10),num(f,20),Math.abs(num(f,40,1))])}
  else if(t==='TEXT'||t==='MTEXT'||t==='ATTRIB'){
   let name=t==='MTEXT'?f.filter(x=>x[0]===1||x[0]===3).map(x=>x[1]).join(''):get(f,1);
   name=name.replace(/\\P/g,' ').replace(/\\[A-Za-z][^;]*;/g,'').replace(/[{}]/g,'').trim();
   if(name)raw.texts.push({name,x:num(f,10),y:num(f,20),h:Math.max(.1,Math.abs(num(f,40,1))),rotation:num(f,50),layer});
  }
  else if(t==='LWPOLYLINE'){
   const vertices=[];let x=null;for(const [c,v] of f){if(c===10)x=Number(v);if(c===20&&x!==null){vertices.push([x,Number(v)]);x=null}}
   for(let j=1;j<vertices.length;j++)addline(...vertices[j-1],...vertices[j],layer);
   if((num(f,70)&1)&&vertices.length>2)addline(...vertices.at(-1),...vertices[0],layer);
  }
  else if(t==='POLYLINE')poly={layer,vertices:[],closed:!!(num(f,70)&1)};
  else if(t==='VERTEX'&&poly)poly.vertices.push([num(f,10),num(f,20)]);
  else if(t==='SEQEND'&&poly){for(let j=1;j<poly.vertices.length;j++)addline(...poly.vertices[j-1],...poly.vertices[j],poly.layer);if(poly.closed&&poly.vertices.length>2)addline(...poly.vertices.at(-1),...poly.vertices[0],poly.layer);poly=null}
  else if(!['POINT','INSERT','ARC','ELLIPSE','SPLINE','HATCH','DIMENSION','SOLID','3DFACE','LEADER','ATTDEF'].includes(t))skipped.set(t,(skipped.get(t)||0)+1);
 }
 if(!raw.lines.length&&!raw.circles.length&&!raw.texts.length)throw Error('表示できる図形や文字が見つかりません。ASCII形式のDXFを確認してください。');
 // Fit into the existing 320 x 250 view and keep text sizes proportional.
 const xs=[],ys=[];const pt=(x,y)=>{if(Number.isFinite(x)&&Number.isFinite(y)){xs.push(x);ys.push(y)}};
 raw.lines.forEach(a=>{pt(a[0],a[1]);pt(a[2],a[3])});raw.circles.forEach(a=>{pt(a[0]-a[2],a[1]-a[2]);pt(a[0]+a[2],a[1]+a[2])});raw.texts.forEach(t=>pt(t.x,t.y));
 const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
 const scale=Math.min(320/Math.max(maxx-minx,1),240/Math.max(maxy-miny,1));
 const X=x=>(x-minx)*scale, Y=y=>(y-miny)*scale;
 return {data:{lines:raw.lines.map(a=>[X(a[0]),Y(a[1]),X(a[2]),Y(a[3]),a[4]]),circles:raw.circles.map(a=>[X(a[0]),Y(a[1]),a[2]*scale]),texts:raw.texts.map(t=>({...t,x:X(t.x),y:Y(t.y),h:Math.max(.55,Math.min(5,t.h*scale))}))},total:objects.length,skipped:[...skipped.keys()]};
}
async function loadDXF(file){
 if(!file)return;
 try{
  $('fileInfo').textContent='読み込み中…';
  const bytes=await file.arrayBuffer();if(bytes.byteLength>35e6)throw Error('35MB以下のDXFを選択してください。');
  let content=new TextDecoder('utf-8').decode(bytes);
  if(content.includes('\uFFFD'))content=new TextDecoder('shift_jis').decode(bytes);
  if(content.startsWith('AutoCAD Binary DXF'))throw Error('バイナリDXFには未対応です。TREND-ONEからASCII DXFで出力してください。');
  const result=parseDXF(content);
  const layerNames=[...new Set(result.data.texts.map(t=>t.layer))];
  const pointLayers=layerNames.filter(x=>/SOKUTENME|点名|測点名|POINT.?NAME/i.test(x));
  if(!pointLayers.length){
   const likely=layerNames.filter(x=>result.data.texts.filter(t=>t.layer===x).some(t=>/^[A-Za-z]{1,5}[-_]?\d+[A-Za-z0-9_-]*$/.test(t.name)));
   pointLayers.push(...likely);
  }
  if(!pointLayers.length)throw Error('点名レイヤーを自動判定できませんでした。点名がTEXTとして出力されているか確認してください。');
  data=result.data;
  textPoints=data.texts.filter(t=>pointLayers.includes(t.layer));
  // Existing renderer recognizes a canonical layer name for point labels.
  for(const t of textPoints)t.layer='SRV_CH1_SOKUTENME';
  state.clear();selected=null;
  drawingId=file.name+'_'+file.size+'_'+file.lastModified;
  currentFileName=file.name.replace(/\.dxf$/i,'').replace(/[\\/:*?"<>|]/g,'_');
  view={x:-12,y:-12,w:344,h:284};original={...view};
  if(db){for(const p of await dbAll()){if(p.drawingId===drawingId){const t=textPoints.find(t=>t.name===p.point);if(t)getState(t)[p.kind].push(p)}}}
  draw();renderList();
  $('fileInfo').textContent=file.name+'（点名 '+textPoints.length+'件）';
  $('message').textContent='読込成功：'+result.total+'要素。点名レイヤー：'+pointLayers.join('、')+'。一部のDXF要素（INSERT・円弧・ハッチ等）は簡易表示では省略されます。';
 }catch(err){$('fileInfo').textContent='読み込み失敗';$('message').textContent='DXF読込エラー：'+err.message;alert('DXF読込エラー：'+err.message)}
}
